resources:
  jobs:
    Transform_NYC_Taxi_Data:
      name: Transform NYC Taxi Data
      tasks:
        - task_key: initialize_database
          notebook_task:
            notebook_path: databricks/src/setup/init_schema.ipynb
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: landing_to_bronze
          depends_on:
            - task_key: initialize_database
          notebook_task:
            notebook_path: databricks/src/bronze/landingToBronze.ipynb
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: silver_transform_payment
          depends_on:
            - task_key: landing_to_bronze
          spark_python_task:
            python_file: databricks/src/silver/payment.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: gold_transform_payment
          depends_on:
            - task_key: silver_transform_payment
          spark_python_task:
            python_file: databricks/src/gold/dim_payment.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: silver_transform_trips
          depends_on:
            - task_key: landing_to_bronze
          spark_python_task:
            python_file: databricks/src/silver/trips.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: silver_transform_type
          depends_on:
            - task_key: landing_to_bronze
          spark_python_task:
            python_file: databricks/src/silver/type.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: gold_transform_type
          depends_on:
            - task_key: silver_transform_type
          spark_python_task:
            python_file: databricks/src/gold/dim_type.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: silver_transform_zone
          depends_on:
            - task_key: landing_to_bronze
          spark_python_task:
            python_file: databricks/src/silver/zone.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: gold_transform_zone
          depends_on:
            - task_key: silver_transform_zone
          spark_python_task:
            python_file: databricks/src/gold/dim_zone.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
        - task_key: gold_transform_trips
          depends_on:
            - task_key: silver_transform_trips
            - task_key: gold_transform_payment
            - task_key: gold_transform_type
            - task_key: gold_transform_zone
          spark_python_task:
            python_file: databricks/src/gold/fact_trips.py
            source: GIT
          existing_cluster_id: 0910-083842-ewxfg2oy
      git_source:
        git_url: https://github.com/TaiBuiii/nyc-taxi-data-pipeline
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
